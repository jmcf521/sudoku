<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding for the page -->
    <meta charset="UTF-8">
    <!-- Makes the page render properly on mobile screens instead of zoomed out -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Text shown in the browser tab -->
    <title>Sudoku</title>
    <!-- Load the stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <!-- Page heading -->
        <h1>Sudoku</h1>
        <!-- Empty container that script.js fills with 81 cell divs -->
        <div class="board" id="board"></div>
    </main>
    <!-- Load the JS after the board div exists, so it has something to attach to -->
    <script src="script.js"></script>
    <script src="solver.js"></script>
</body>

</html>
